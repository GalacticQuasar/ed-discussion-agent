[project]
name = "ed-discussion-mcp"
version = "0.2.0"
description = "Read-only MCP server that lets AI agents search and read your Ed Discussion (edstem.org) courses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GalacticQuasar" }]
keywords = ["mcp", "ed discussion", "edstem", "model context protocol"]
dependencies = [
    "mcp>=2.3,<3",
    "ollama>=0.6.3",
    "requests>=2.31",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
# The `listen` daemon: Ed's websocket stream, and a QR code for the ntfy link.
listener = [
    "aiohttp>=3.9",
    "segno>=1.6",
]

[project.scripts]
ed-discussion-mcp = "ed_discussion_mcp.server:main"

[project.urls]
Repository = "https://github.com/GalacticQuasar/ed-discussion-agent"

[dependency-groups]
# Not part of the package: the scripts in experiments/.
experiments = [
    "aiohttp",
    "fastapi",
    "python-dotenv",
    "uvicorn",
]
# Not part of the package: the test suite in tests/.
dev = [
    "pytest",
    "responses",
]

[tool.uv]
default-groups = ["experiments", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Ship only the package, not experiments/, local settings or other repo files.
include = ["src/ed_discussion_mcp", "README.md", "LICENSE", "pyproject.toml"]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27+ supports PEP 639 license metadata
build-backend = "hatchling.build"
